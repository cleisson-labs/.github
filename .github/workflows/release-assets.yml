name: Assemble release assets
on:
  workflow_call:
    inputs:
      assets:
        description: Exact archive filenames, one per line, across release-part-* artifacts
        type: string
        required: true
      combined-checksums:
        description: Write SHA256SUMS instead of one .sha256 per archive
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: Immutable artifact ID of the verified release bundle
        value: ${{ jobs.assemble.outputs.artifact-id }}

permissions: {}

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
          path: infrastructure
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-part-*
          path: parts
      - name: Require the exact asset set and compute SHA-256 checksums
        env:
          ASSETS: ${{ inputs.assets }}
          COMBINED: ${{ inputs.combined-checksums }}
        run: python3 infrastructure/scripts/release.py assemble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: bundle
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
