name: CI
on:
  pull_request:
  push:
    branches: [$default-branch]
  schedule:
    - cron: '29 8 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    permissions:
      contents: read
    uses: cleisson-labs/.github/.github/workflows/security.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
  docs:
    permissions:
      contents: read
    uses: cleisson-labs/.github/.github/workflows/docs.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      external: ${{ github.event_name == 'schedule' }}
  test:
    permissions:
      contents: read
    uses: cleisson-labs/.github/.github/workflows/rust.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
  dependencies:
    permissions:
      contents: read
    uses: cleisson-labs/.github/.github/workflows/rust-audit.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
  codeql:
    permissions:
      contents: read
      security-events: write
    uses: cleisson-labs/.github/.github/workflows/codeql.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      language: rust
  ci-ok:
    if: always()
    needs: [security, docs, test, dependencies, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$RESULTS"
