name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: environment
    attributes:
      label: Version and platform
      description: Include the release or commit and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data and remove private information.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
